name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # DATABASE_URL aponta pro MariaDB efêmero definido em `services` abaixo —
  # é real dentro do job (existe só durante o workflow), mas não é nenhum
  # banco de verdade fora daqui. Prisma generate e o build do Next não
  # precisam dele; os testes de integração (test:db) sim.
  DATABASE_URL: "mysql://root:root@127.0.0.1:3306/fidelize_ci"
  AUTH_SECRET: "ci-placeholder-secret-not-used-in-prod"
  AUTH_URL: "http://localhost:3000"
  NEXT_PUBLIC_APP_URL: "http://localhost:3000"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: fidelize_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Gerar tipos de rotas do Next
        # tsconfig.json inclui .next/types e .next/dev/types (LayoutProps,
        # PageProps etc.) — sem gerar isso antes, o typecheck falha achando
        # que faltam esses tipos, mesmo com o código correto.
        run: npx next typegen

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (sem banco)
        run: npm test

      - name: Aplicar migrations no banco efêmero
        run: npx prisma migrate deploy

      - name: Semear o banco efêmero
        # A maioria dos testes de integração parte de uma clínica/usuário já
        # existentes (mesmo pré-requisito do ambiente local — ver mensagens
        # "Seed necessário antes dos testes de DB" nos próprios arquivos).
        run: npm run db:seed

      - name: Testes de integração (com banco, inclui isolamento de tenant)
        run: npm run test:db

      - name: Build de produção
        run: npm run build
